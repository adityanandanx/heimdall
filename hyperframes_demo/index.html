<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      
      

      <!--
        Add your clips here. Example:
        <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="1"
             style="font-size: 64px; color: #fff; padding: 40px">
          Hello World
        </div>
      -->
    <audio id="voiceover" class="clip" src="speech.wav" data-start="0" data-duration="10"></audio>
<audio id="bgm" class="clip" src="silent.wav" data-start="0" data-duration="25"></audio>
</div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Example: tl.from("#title", { opacity: 0, y: -50, duration: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  <div class="title clip" id="hero-title" data-start="0" data-dur="5" style="position:absolute;top:200px;width:100%;text-align:center;color:#fff;font-size:80px;font-weight:bold;">Heimdall</div>
<div class="subtitle clip" id="hero-subtitle" data-start="5" data-dur="5" style="position:absolute;top:350px;width:100%;text-align:center;color:#ccc;font-size:40px;">Local screen‑only memory for Hyprland</div>
</body>
</html>
