<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heimdall day-browser — prototype</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a23; --panel2:#1a202b; --line:#242c3a;
    --text:#e8ebf2; --dim:#8b93a7; --faint:#5b6476; --accent:#5b8cff; --accent2:#3ecf8e;
    --warn:#f0b456; --danger:#ff6b6b;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.45}
  .hidden{display:none !important}
  img{display:block}
  button{font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:8px; padding:6px 12px}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.4; cursor:default}
  input[type=text]{font:inherit; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; outline:none; width:100%}
  input[type=text]:focus{border-color:var(--accent)}
  .chip{display:inline-flex; align-items:center; gap:4px; font-size:11px; border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:2px 8px; white-space:nowrap}
  .chip.b{color:var(--accent2); border-color:rgba(62,207,142,.35)}
  .chip.w{color:var(--warn); border-color:rgba(240,180,86,.35)}
  .muted{color:var(--dim)}
  .faint{color:var(--faint)}
  a{color:var(--accent); text-decoration:none}

  /* ============ floating prototype switcher ============ */
  #switcher{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:1000;
    display:flex; align-items:center; gap:10px; background:#000c; backdrop-filter:blur(8px);
    border:1px solid var(--line); border-radius:999px; padding:6px 14px; box-shadow:0 4px 20px rgba(0,0,0,.5)}
  #switcher .lbl{font-size:12px; color:var(--dim); font-weight:600; letter-spacing:.2px}
  #switcher button{width:30px; height:30px; padding:0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--panel2)}
  #switcher .hint{font-size:11px; color:var(--faint)}

  /* ================= shared bits ================= */
  .topbar{display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50}
  .brand{font-weight:700; letter-spacing:.4px; display:flex; align-items:center; gap:8px}
  .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--accent2); box-shadow:0 0 10px var(--accent2)}
  .brand .dot.dead{background:var(--danger); box-shadow:0 0 10px var(--danger)}
  .grow{flex:1}
  .daynav{display:flex; align-items:center; gap:6px}
  .daynav .date{font-weight:600; min-width:150px; text-align:center; font-size:14px}
  .daynav button{width:30px; height:30px; padding:0; border-radius:50%}

  /* ================= Variant A — Reel ================= */
  #va .main{display:grid; grid-template-columns:1fr 340px; height:calc(100vh - 54px)}
  #va .stage{display:flex; flex-direction:column; min-width:0}
  #va .preview{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; background:var(--bg)}
  #va .preview img{max-width:100%; max-height:calc(100% - 8px); object-fit:contain; border-radius:6px}
  #va .preview .cap{position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:#000b; border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:12px; color:var(--dim); display:flex; gap:8px; align-items:center; white-space:nowrap}
  #va .reel{height:132px; background:var(--panel); border-top:1px solid var(--line); display:flex; align-items:center; padding:10px 12px; gap:8px; overflow-x:auto}
  #va .frame{flex:0 0 auto; width:118px; border:2px solid transparent; border-radius:8px; overflow:hidden; background:var(--panel2); cursor:pointer; position:relative}
  #va .frame img{width:118px; height:78px; object-fit:cover}
  #va .frame .t{font-size:10px; color:var(--dim); padding:4px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #va .frame.sel{border-color:var(--accent)}
  #va .frame .mus{position:absolute; top:4px; right:4px; font-size:9px; background:var(--accent2); color:#06281a; border-radius:999px; padding:1px 5px; font-weight:700}
  #va .frame:hover{filter:brightness(1.15)}
  #va .side{border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:16px}
  #va .side h3{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--faint); margin:18px 0 8px}
  #va .side h3:first-child{margin-top:0}
  #va .win{font-weight:700; font-size:15px; margin-bottom:2px}
  #va .ocr{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; color:var(--dim); max-height:220px; overflow-y:auto; white-space:pre-wrap; word-break:break-word}
  #va .trk{display:flex; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line)}
  #va .trk .eq{width:8px; height:8px; border-radius:2px; background:var(--accent2); flex:0 0 auto; animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  #va .trk.p .eq{animation:none; background:var(--faint)}
  #va .recapCard{background:linear-gradient(160deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:12px; padding:12px}
  #va .recapCard .rhead{font-weight:700; margin-bottom:6px; font-size:13px}
  #va .recapCard p{font-size:12px; color:var(--dim)}
  #va .stat{display:flex; justify-content:space-between; font-size:12px; padding:5px 0; border-bottom:1px dashed var(--line)}

  /* ================= Variant B — Scrollback ================= */
  #vb{height:calc(100vh - 54px); display:grid; grid-template-columns:1fr 320px; overflow:hidden}
  #vb .feed{overflow-y:auto; padding:18px 20px 90px}
  #vb .searchbar{display:flex; gap:8px; align-items:center; margin-bottom:16px; position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:5}
  #vb .searchbar input{font-size:15px; padding:10px 14px}
  #vb .row{display:grid; grid-template-columns:56px 170px 1fr; gap:14px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line)}
  #vb .row .thumb{width:170px; height:104px; border-radius:6px; object-fit:cover; cursor:pointer; border:1px solid var(--line)}
  #vb .row .thumb:hover{border-color:var(--accent)}
  #vb .row .time{font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums}
  #vb .row .ttl{font-weight:600; font-size:13px; margin:2px 0 4px}
  #vb .row .snip{font-size:12px; color:var(--dim); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  #vb .row .musline{margin-top:6px}
  #vb .daysep{display:flex; align-items:center; gap:12px; margin:22px 0 10px; color:var(--dim); font-weight:700; font-size:13px}
  #vb .daysep::after{content:""; flex:1; height:1px; background:var(--line)}
  #vb .daysep::before{content:""; flex:1; height:1px; background:var(--line)}
  #vb .pager{display:flex; justify-content:center; gap:10px; margin-top:18px}
  #vb .side{border-left:1px solid var(--line); background:var(--panel); padding:16px; overflow-y:auto}
  #vb .side h3{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--faint); margin:18px 0 8px}
  #vb .breakbar{margin:6px 0 2px; background:var(--panel2); border:1px solid var(--line); border-radius:6px; overflow:hidden; height:10px; display:flex}
  #vb .breakbar i{display:block; height:100%}

  /* ================= Variant C — Story ================= */
  #vc{max-width:760px; margin:0 auto; padding:20px 24px 90px; height:calc(100vh - 54px); overflow-y:auto}
  #vc .cdate{font-size:13px; color:var(--faint); font-weight:600; text-transform:uppercase; letter-spacing:1.5px; text-align:center; margin:10px 0 4px}
  #vc h1{font-size:26px; font-weight:800; text-align:center; margin-bottom:4px}
  #vc .glimpse{display:flex; gap:10px; justify-content:center; margin:14px 0 6px}
  #vc .glimpse .stat{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 16px; text-align:center}
  #vc .glimpse .n{font-size:20px; font-weight:800}
  #vc .glimpse .l{font-size:11px; color:var(--dim)}
  #vc .ch{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin:16px 0}
  #vc .ch .chhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px}
  #vc .ch .chtitle{font-weight:700; font-size:15px}
  #vc .ch .chrange{font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}
  #vc .ch .chdesc{font-size:13px; color:var(--dim); margin:4px 0 12px}
  #vc .ch .shots{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px}
  #vc .ch .shots img{width:150px; height:96px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:pointer}
  #vc .ch .shots img:hover{border-color:var(--accent)}
  #vc .snd{display:flex; align-items:center; gap:10px; background:linear-gradient(120deg,#0d2b1e,#0e1116); border:1px solid rgba(62,207,142,.3); border-radius:12px; padding:10px 14px; margin:16px 0}
  #vc .snd .now{font-size:11px; color:var(--accent2); font-weight:700; letter-spacing:1px; text-transform:uppercase}
  #vc .snd .song{font-weight:700}
  #vc .snd .art{font-size:12px; color:var(--dim)}
  #vc .recap{background:linear-gradient(160deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px}
  #vc .recap h2{font-size:15px; margin-bottom:8px}
  #vc .recap p{font-size:13px; color:var(--dim)}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#2a3344; border-radius:99px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>

  <span class="lbl" id="vlabel"></span>
  <button id="next" title="next variant (→)">›</button>
  <span class="hint">← → switch</span>
</div>

  el.innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="dot"></span>Heimdall</div>
      <div class="daynav">
        <button data-day="prev" title="previous day">‹</button>
        <span class="date" id="vdate">${dayStr}</span>
        <button data-day="next" title="next day">›</button>
      </div>
      <div class="grow"></div>
      <div class="chip w" id="vstatus">capture alive · 116 frames today</div>
    </div>
    <div class="main">
      <div class="stage">
        <div class="preview" id="vprev"></div>
        <div class="reel" id="vreel"></div>
      </div>
      <div class="side">
        <h3>Now</h3>
        <div class="win" id="vwin"></div>
        <div class="muted" id="vmeta"></div>
        <div id="vmus"></div>
        <h3>Screen</h3>
        <div class="ocr" id="vocr"></div>
        <h3>Day recap</h3>
        <div class="recapCard">
          <div class="rhead">Your day at a glance</div>
          <p id="vrecap"></p>
        </div>
        <h3>Today's soundtrack</h3>
        <div id="vsnd"></div>
      </div>
    </div>`;

  const q = s => el.querySelector(s);

  function paint(){
    const f = sel;
    q('#vwin').textContent = f.window_title || '(untitled window)';
    q('#vmeta').textContent = `${fmt(f.ts)} · ${f.window_class}${f.fullscreen ? ' · fullscreen' : ''}`;
    q('#vocr').textContent = f.ocr_text || 'no OCR text captured';
    q('#vprev').innerHTML = `<img src="${imgOf(f)}" alt="frame">`;
    const cap = [`${fmt(f.ts)}`, `${f.window_class}`].join(' · ');
    q('#vprev').innerHTML += `<div class="cap">${cap}</div>`;
    const mus = playingAt(f.ts);
    q('#vmus').innerHTML = mus
      ? `<div class="chip b" style="margin-top:8px">♪ ${esc(musicBlock(mus))}</div>`
      : `<div class="chip" style="margin-top:8px">no music</div>`;
    q('#vrecap').textContent = recapText;
    q('#vsnd').innerHTML = playingStarts.length
      ? playingStarts.map(t =>
          `<div class="trk${t.status!=='Playing'?' p':''}"><span class="eq"></span><div><div style="font-size:12px;font-weight:600">${esc(musicBlock(t))}</div><div class="faint" style="font-size:11px">${fmt(t.ts)}</div></div></div>`).join('')
      : '<div class="muted faint">nothing played today</div>';

    q('#vreel').innerHTML = frames.map(f =>
      `<div class="frame${f.id===sel.id?' sel':''}" data-id="${f.id}">
        <img src="${imgOf(f)}" alt="" loading="lazy">
        ${playingAt(f.ts)?'<span class="mus">♪</span>':''}
        <div class="t">${fmt(f.ts)} · ${esc(f.window_class)}</div>
      </div>`).join('');

    q('#vreel').querySelectorAll('.frame').forEach(c=>c.addEventListener('click',()=>{ sel = frames.find(x=>x.id===+c.dataset.id); paint(); }));
    q('#vdate').textContent = fmtFull(sel.ts);
  }
  paint();
  return el;
}

/* ==================== Variant B — Scrollback ==================== */
function variantB(){
  const frames = [...DATA.items].sort((a,b)=>a.ts-b.ts).reverse(); // newest first
  const dayStr = fmtFull(frames[0].ts);
  let q = '';

  const el = document.createElement('div');
  el.id = 'vb';
  el.innerHTML = `
    <div class="feed">
      <div class="topbar" style="position:static">
        <div class="brand"><span class="dot"></span>Heimdall</div>
        <div class="grow"></div>
        <div class="chip w">capture alive</div>
      </div>
      <div class="searchbar">
        <input type="text" id="vq" placeholder="Search your memory — e.g. “agentic”, “Strokes”, “chrome”…" autocomplete="off">
      </div>
      <div id="vfeed"></div>
      <div class="pager">
        <button id="volder">← load older</button>
        <button id="vnewer">load newer →</button>
      </div>
    </div>
    <div class="side">
      <h3>Search first</h3>
      <p class="muted" style="font-size:12px">Type to filter every captured frame, right now. Or scroll the day like a diary.</p>
      <h3>Where you were</h3>
      <div id="vclasses"></div>
      <h3>Time breakdown</h3>
      <div id="vbreak"></div>
      <h3>Soundtrack</h3>
      <div id="vsnd"></div>
    </div>`;

  function classesList(){
    const c = {};
    for (const f of DATA.items) c[f.window_class]=(c[f.window_class]||0)+1;
    return Object.entries(c).sort((a,b)=>b[1]-a[1]);
  }
  function breakBars(){
    const c = classesList();
    const max = Math.max(...c.map(x=>x[1]));
    return `<div class="breakbar">${c.map(([k,n])=>`<i style="width:${n/max*100}%;background:${clsColor(k)}"></i>`).join('')}</div>` +
      c.map(([k,n])=>`<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim);padding:2px 0"><span>${esc(k)}</span><span class="faint">${n}</span></div>`).join('');
  }
  function clsColor(cls){
    const pal=['#5b8cff','#3ecf8e','#f0b456','#c07bff','#ff7b9c','#37c2d6'];
    let h=0; for(const ch of cls) h=(h*31+ch.charCodeAt(0))>>>0;
    return pal[h%pal.length];
  }
  const qs = s => el.querySelector(s);
  function draw(){
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const list = frames.filter(f => !terms.length || terms.every(t => (f.ocr_text||'').toLowerCase().includes(t) || (f.window_title||'').toLowerCase().includes(t) || (f.window_class||'').toLowerCase().includes(t)));
    qs('#vfeed').innerHTML =
      `<div class="daysep">${dayStr}</div>` +
      list.map(f => {
        const mus = playingAt(f.ts);
        return `<div class="row" data-id="${f.id}">
          <div class="time">${fmt(f.ts)}</div>
          <img class="thumb" src="${imgOf(f)}" alt="" loading="lazy">
          <div>
            <div class="ttl">${esc(f.window_title||'(untitled)')} <span class="chip">${esc(f.window_class)}</span></div>
            <div class="snip">${esc((f.ocr_text||'').slice(0,160))}</div>
            ${mus?`<div class="musline"><span class="chip b">♪ ${esc(musicBlock(mus))}</span></div>`:''}
          </div>
        </div>`;
      }).join('') || '<p class="muted" style="padding:20px">nothing matches — try a different word</p>';
    qs('#vfeed').querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>{
      const f = DATA.items.find(x=>x.id===+r.dataset.id);
      window.open(imgOf(f), '_blank');
    }));
    qs('#vclasses').innerHTML = classesList().map(([k,n])=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--line)"><span>${esc(k)}</span><span class="faint">${n} frames</span></div>`).join('');
    qs('#vbreak').innerHTML = breakBars();
    qs('#vsnd').innerHTML = playingStarts.map(t=>`<div style="font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)"><span class="chip b" style="font-size:10px">♪</span> ${esc(musicBlock(t))}<div class="faint" style="font-size:10px">${fmt(t.ts)}</div></div>`).join('');
  }
  el.querySelector('#vq').addEventListener('input', e => { q = e.target.value; draw(); });
  el.querySelector('#volder').addEventListener('click', () => alert('prototype: day-at-a-time pagination — the API is ASC-only today, so “older” needs a day window.'));
  el.querySelector('#vnewer').addEventListener('click', () => alert('prototype: you are at today’s newest.'));
  draw();
  return el;
}

/* ==================== Variant C — Story ==================== */
function variantC(){
  const frames = [...DATA.items].sort((a,b)=>a.ts-b.ts);
  const dayStr = fmtFull(frames[0].ts);
  const chaps = chapters(frames);

  const el = document.createElement('div');
  el.id = 'vc';
  el.innerHTML = `
    <div class="topbar" style="position:static">
      <div class="brand"><span class="dot"></span>Heimdall</div>
      <div class="grow"></div>
      <div class="chip w">capture alive</div>
    </div>
    <div class="cdate">${dayStr}</div>
    <h1>${chaps.length} chapters</h1>
    <div class="glimpse">
      <div class="stat"><div class="n">${frames.length}</div><div class="l">frames</div></div>
      <div class="stat"><div class="n">${chaps.length}</div><div class="l">apps</div></div>
      <div class="stat"><div class="n">${playingStarts.length}</div><div class="l">songs</div></div>
    </div>
    <div class="recap">
      <h2>How your day went</h2>
      <p>${esc(recapFor())}</p>
    </div>
    <div id="vstory"></div>`;

  const q = s => el.querySelector(s);

  q('#vstory').innerHTML = chaps.map((ch,i)=>{
    const f0 = ch.frames[0], f1 = ch.frames[ch.frames.length-1];
    const mus = playingAt(f0.ts);
    const next = chaps[i+1];
    const nextMus = next ? playingAt(next.frames[0].ts) : null;
    return `
      <div class="ch">
        <div class="chhead">
          <div class="chtitle">${esc(ch.cls)}</div>
          <div class="chrange">${fmt(f0.ts)} – ${fmt(f1.ts)}</div>
        </div>
        <div class="chdesc">${esc(f0.window_title||'')}${f1!==f0 ? ' · ' + esc(f1.window_title||'') : ''} — ${ch.frames.length} frame${ch.frames.length>1?'s':''}</div>
        <div class="shots">
          ${ch.frames.slice(0,8).map(f=>`<img src="${imgOf(f)}" alt="" loading="lazy" data-id="${f.id}">`).join('')}
        </div>
      </div>
      ${mus && mus.title ? `<div class="snd"><span class="now">♪ now playing</span><div><div class="song">${esc(musicBlock(mus))}</div><div class="art">${fmt(mus.ts)}</div></div></div>` : ''}
    `;
  }).join('');
  el.querySelectorAll('#vstory img').forEach(im=>im.addEventListener('click',()=>window.open(im.src,'_blank')));
  return el;
}

/* ---------- synthesized recap from real frame/track data ---------- */
function recapFor(){
  const frames = DATA.items;
  const c = {}; for (const f of frames) c[f.window_class]=(c[f.window_class]||0)+1;
  const top = Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,n])=>`${k} (${n} captures)`);
  const songs = new Set(playingStarts.map(t=>t.title).filter(Boolean)).size;
  return `You spent most of the day in ${top.join(', ')}. ` +
    (songs?`${songs} distinct songs played in the background. `:'') +
    `Your day ran from ${fmt(frames[0].ts)} to ${fmt(frames[frames.length-1].ts)}.` +
    `\n\n(prototype recap — the scheduled recap runs at 23:00 via the Gemma pipe; this is a synthesized stand-in.)`;
}

/* ==================== switcher ==================== */
const VARIANTS = [['A','Reel — filmstrip + side panel', variantA], ['B','Scrollback — search-first log', variantB], ['C','Story — narrative of the day', variantC]];
let cur = 0;
const sp = new URLSearchParams(location.search);
const startIdx = Math.max(0, VARIANTS.findIndex(([k])=>k===sp.get('variant')));
if (startIdx >= 0) cur = startIdx;

function render(){
  const [key, name, fn] = VARIANTS[cur];
  $('#app').innerHTML = '';
  $('#app').appendChild(fn());
  $('#vlabel').textContent = `${key} — ${name}`;
  history.replaceState(null, '', `?variant=${key}`);
}
function go(n){ cur = (cur + n + VARIANTS.length) % VARIANTS.length; render(); }
$('#prev').addEventListener('click', ()=>go(-1));
$('#next').addEventListener('click', ()=>go(1));
window.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || document.activeElement.isContentEditable) return;
  if (e.key==='ArrowLeft') go(-1);
  if (e.key==='ArrowRight') go(1);
});
render();
</script>
</body>
