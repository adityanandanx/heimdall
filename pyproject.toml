[project]
name = "heimdall"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya Nandan", email = "nandanaditya985@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pygobject>=3.56.0",
    "pyyaml>=6.0.3",
    "rapidocr>=3.9.2",
    "typer>=0.27.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
heimdall = "heimdall:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
